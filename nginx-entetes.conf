# Les en-têtes que TOUTE réponse doit porter.
#
# Ce fichier existe à cause d'un piège de nginx : un `add_header` posé dans un bloc
# `location` n'ajoute pas aux en-têtes du serveur, il les REMPLACE tous. Un bloc qui
# n'ajoute qu'une consigne de cache perd donc, en silence, la politique de sécurité et le
# reste. On les rassemble ici, et chaque bloc les réintroduit d'un `include`.
#
# La politique de contenu se limite volontairement à `frame-ancestors` : tout le reste est
# posé en balise `<meta>` par `vite.config.ts`, avec l'empreinte du script en ligne.
# Recopier la politique complète ici créerait une deuxième version à tenir à jour, et deux
# politiques s'intersectent — une empreinte oubliée d'un côté rebloquerait le script.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
