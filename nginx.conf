# Service du site statique.
#
# Le site est pré-rendu : trois pages, quelques ressources empreintées, rien de dynamique.
# Ce fichier n'a donc que trois soucis — les en-têtes, le cache, et les trois adresses de
# langue.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ne pas annoncer la version de nginx dans chaque réponse ni dans les pages d'erreur.
    server_tokens off;

    # Les redirections partent en relatif. Sinon nginx reconstruit une adresse absolue à
    # partir de ce qu'il croit être son hôte — derrière Traefik, c'est son port interne et
    # son schéma en clair : `/de` renvoyait vers `http://localhost/de/`.
    absolute_redirect off;

    include /etc/nginx/snippets/entetes.conf;

    # ---------------------------------------------------------------------
    # Compression
    # ---------------------------------------------------------------------
    # Les fichiers `.gz` ont été produits à la construction, une fois, au niveau 9.
    gzip_static on;
    # Ils ne se demandent pas par leur nom. `gzip_static` les sert en interne, sans passer
    # par un bloc `location` : `/index.html.gz` répondait donc 200 en
    # `application/octet-stream`, c'est-à-dire une deuxième adresse pour chaque page, que
    # rien n'annonce et qu'un moteur peut trouver. Le `.br` est là par précaution, pour le
    # jour où l'image de base saura le servir.
    location ~ \.(gz|br)$ { return 404; }
    # Repli pour ce qui n'aurait pas de version précomprimée.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # ---------------------------------------------------------------------
    # Cache
    # ---------------------------------------------------------------------
    # Les ressources de `/assets/` portent une empreinte dans leur nom : un changement
    # produit un autre nom. Elles peuvent donc être gardées pour toujours.
    #
    # `Cache-Control` est posé à la main et NON par `expires` : les deux écrivent le même
    # en-tête, et la réponse en portait alors deux exemplaires, dont un sans `immutable`.
    location /assets/ {
        include /etc/nginx/snippets/entetes.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Les polices vivent dans `/assets/` mais un bloc en expression régulière l'emporte
    # sur un bloc en préfixe : il faut donc y reposer le cache. Ce qu'elles ajoutent, c'est
    # le CORS que réclame `<link rel="preload" crossorigin>`.
    location ~* \.woff2$ {
        include /etc/nginx/snippets/entetes.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    # Les captures de l'application ne portent pas d'empreinte — elles sont servies depuis
    # `public/` pour que le pré-rendu puisse écrire leur nom en dur dans le HTML statique.
    # Sans ce bloc, elles tomberaient dans `location /` et son `no-cache`, et chaque visite
    # retéléchargerait un mégaoctet d'images qui ne changent qu'à la régénération. Une
    # semaine : assez pour que la deuxième visite soit gratuite, assez peu pour qu'une
    # capture corrigée parvienne aux lecteurs sans qu'on ait à renommer les fichiers.
    location /captures/ {
        include /etc/nginx/snippets/entetes.conf;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # Les images de la RACINE : favicons, vignettes de partage, QR. Elles sont dans le même
    # cas que les captures — pas d'empreinte dans leur nom, engendrées par script, servies
    # depuis `public/` — et elles tombaient pourtant dans `location /` et son `no-cache` :
    # le QR est préchargé sur chaque page, il repartait à chaque visite. Une semaine, comme
    # les captures, et pour la même raison.
    #
    # `^/[^/]+\.` : la racine SEULEMENT. Un bloc en expression régulière l'emporte sur un
    # bloc en préfixe, si bien que `\.(svg|png)$` seul aurait repris `/assets/` ses
    # ressources empreintées — donc leur cache d'un an — et `/captures/` les siennes.
    location ~* ^/[^/]+\.(svg|png|ico|webp)$ {
        include /etc/nginx/snippets/entetes.conf;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # Les pages, elles, ne portent pas d'empreinte : gardées, elles montreraient
    # l'ancienne version après un déploiement, et les ressources qu'elles nomment
    # n'existeraient plus.
    location ~* \.html$ {
        include /etc/nginx/snippets/entetes.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Le plan du site et le fichier des robots changent à chaque publication.
    location ~* ^/(sitemap\.xml|robots\.txt)$ {
        include /etc/nginx/snippets/entetes.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # ---------------------------------------------------------------------
    # Les trois adresses
    # ---------------------------------------------------------------------
    # `/de` et `/de/` doivent mener à la même page.
    location = /de { return 301 /de/; }
    location = /lb { return 301 /lb/; }

    # Chaque dossier de langue a son `index.html`. Tout ce qui n'existe pas tombe en 404,
    # et NON sur la page d'accueil : ce site n'a pas de routage côté navigateur, et
    # répondre 200 à une adresse inventée la ferait indexer comme une page de plus.
    #
    # `try_files` sert `index.html` sans passer par le bloc `\.html$` ci-dessus — d'où le
    # `no-cache` reposé ici, sans quoi la page d'accueil serait servie sans consigne.
    location / {
        include /etc/nginx/snippets/entetes.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
