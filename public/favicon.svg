<!--
  Le bus, même géométrie que `public/favicon.svg` de l'application.

  Les couleurs, elles, sont celles de la palette courante (lot 18 « verre ») : `--fond`
  #0e1a2e, `--accent` #a9dcf5, `--encre` #e9eff6. L'icône de l'application est restée sur
  l'ancienne palette (#14161f / #82a9ff) — son propre script de génération le note comme
  un oubli de la refonte. La vitrine ne recopie donc pas ces valeurs : elle serait née
  désaccordée de sa propre charte.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#0e1a2e"/>
  <rect x="116" y="112" width="280" height="248" rx="44" fill="#a9dcf5"/>
  <rect x="152" y="152" width="208" height="104" rx="20" fill="#0e1a2e"/>
  <circle cx="180" cy="306" r="24" fill="#0e1a2e"/>
  <circle cx="332" cy="306" r="24" fill="#0e1a2e"/>
  <rect x="150" y="360" width="52" height="46" rx="16" fill="#e9eff6"/>
  <rect x="310" y="360" width="52" height="46" rx="16" fill="#e9eff6"/>
</svg>
