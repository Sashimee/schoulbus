<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bus scolaire Beckerich — les horaires de vos enfants, sans y réfléchir</title>
    <meta
      name="description"
      content="Le plan du bus scolaire de la commune de Beckerich, personnalisé pour chaque enfant : arrêt le plus proche, prochain départ, fiche de la semaine. Site indépendant, hors ligne, sans compte."
    />
    <!--
      La couleur de barre suit le thème. Elle ne suit PLUS celle de l'application : la
      vitrine a sa propre charte depuis la refonte (voir la couche `vitrine` de
      `src/styles/vitrine.css`), et une barre système bleu nuit au-dessus d'une page crème
      se lit comme un défaut d'affichage. Les deux valeurs sont `--vitrine-creme` dans
      chacun des deux thèmes.
    -->
    <meta name="theme-color" content="#121a19" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbf6ef" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Le SVG suffit aux navigateurs. Les deux lignes qui suivent servent ailleurs :
      iOS ignore un favicon SVG quand on pose un raccourci sur l'écran d'accueil et
      fabrique alors une vignette de la page ; et quelques agrégateurs ne lisent que
      le PNG. Les deux fichiers sont engendrés par `npm run assets:partage`.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!--metas-partage-->
    <!--
      Le thème est posé avant le premier rendu : sans ce script, une page servie en
      pré-rendu clignote en sombre avant de basculer en clair chez qui l'a choisi.
    -->
    <script>
      try {
        var t = localStorage.getItem('vitrine-schoulbus.theme')
        if (t === 'clair' || t === 'sombre') document.documentElement.dataset.theme = t
      } catch (e) {
        /* localStorage refusé : la préférence système suffit. */
      }
    </script>
  </head>
  <body>
    <div id="racine"><!--contenu-vitrine--></div>
    <!--
      Ce bloc était écrit ici, en français, et le pré-rendu le recopiait tel quel : `/de/`,
      `/lb/`, `/pt/` et `/en/` servaient un paragraphe français sous leur propre `lang`,
      c'est-à-dire que le seul lecteur pour qui ce bloc existe était le seul à ne pas être
      servi dans sa langue. Il est désormais engendré par langue (`blocNoscript` dans
      `src/entree-serveur.ts`) et posé ici par `scripts/prerendu.mjs`.

      Conséquence heureuse : ce n'est plus « le seul endroit que l'interrupteur ne couvre
      pas ». `APP_PUBLIEE` décide maintenant du lien vers l'application ici comme partout
      ailleurs, et un test le vérifie dans les cinq langues.

      Vide en développement, donc — où le gabarit est servi tel quel et où JavaScript
      tourne par définition.
    -->
    <noscript><!--noscript--></noscript>
    <script type="module" src="/src/entree.tsx"></script>
  </body>
</html>
